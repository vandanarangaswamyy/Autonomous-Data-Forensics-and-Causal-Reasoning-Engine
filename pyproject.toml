[project]
name = "atlas-forensics"
version = "0.1.0"
description = "Autonomous Data Forensics and Causal Reasoning Engine"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<2.1", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "confluent-kafka>=2.8,<3", "mcp>=1.26,<2", "sqlglot>=28,<31", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
teradata = ["teradatasql>=20,<21"]

[project.scripts]
atlas-sim = "atlas_simulator.cli:main"
atlas-mcp = "atlas_mcp.server:main"
atlas-mcp-client = "atlas_mcp.client:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/atlas_api", "packages/core/src/atlas_core", "packages/contracts/src/atlas_contracts", "packages/database/src/atlas_database", "services/simulator/src/atlas_simulator", "evaluation/src/atlas_evaluation", "services/mcp/src/atlas_mcp"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5", "types-jsonschema>=4.23,<5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "packages/core/src", "packages/contracts/src", "packages/database/src", "services/simulator/src", "services/mcp/src", "evaluation/src", "packages/database/migrations", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # Source-only repository automation tests import scripts.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: requires explicit PostgreSQL/Kafka environment"]
